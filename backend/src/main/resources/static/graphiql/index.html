<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>GraphiQL</title>
    <link rel="stylesheet" href="/graphiql/graphiql.min.css" />
    <style>
        body {
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #graphiql {
            height: 100vh;
        }
    </style>
</head>
<body>
<div id="graphiql">Loading...</div>

<!-- React & ReactDOM -->
<script src="/graphiql/react.production.min.js"></script>
<script src="/graphiql/react-dom.production.min.js"></script>

<!-- GraphiQL -->
<script src="/graphiql/graphiql.min.js"></script>

<script>
    const graphQLFetcher = (graphQLParams) => {
        return fetch('/graphql', {
            method: 'post',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(graphQLParams),
            credentials: 'include', // 쿠키(JWT) 쓸 때 필요
        }).then(function (response) {
            return response.json().catch(function () {
                return response.text();
            });
        });
    };

    const root = ReactDOM.createRoot(document.getElementById('graphiql'));
    root.render(
        React.createElement(GraphiQL, {
            fetcher: graphQLFetcher,
        })
    );
</script>
</body>
</html>
