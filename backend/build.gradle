plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.1'
    id 'io.spring.dependency-management' version '1.1.5'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '17'

repositories {
    mavenCentral()
}

dependencies {

    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
    // --- Spring ---
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // S3
    implementation "software.amazon.awssdk:s3:2.25.40"

    // --- email---
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // ---Google Oauth2 ---
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'



    // --- Database ---
    runtimeOnly 'org.postgresql:postgresql'

    // --- GraphQL ---
    implementation 'org.springframework.boot:spring-boot-starter-graphql'
    implementation 'org.springframework.graphql:spring-graphql:1.3.2'
//    implementation 'org.springframework.graphql:spring-graphql:1.3.1'

    // --- Lombok ---
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // --- MapStruct ---
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

    // --- JWT ---
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // --- Redis ---
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // --- AWS S3 ---
    implementation 'com.amazonaws:aws-java-sdk-s3:1.12.700'
    implementation platform("software.amazon.awssdk:bom:2.25.20")
    implementation "software.amazon.awssdk:s3"
    implementation 'com.github.albfernandez:juniversalchardet:2.4.0'
    implementation 'org.apache.poi:poi-ooxml:5.2.5'


    implementation 'com.vladmihalcea:hibernate-types-60:2.21.1'
    implementation "com.graphql-java:graphql-java-extended-scalars:22.0"


    // --- Test ---
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
test {
    useJUnitPlatform()
}